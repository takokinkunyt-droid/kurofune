<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 黒船クリッカーのロゴ（オリジナル）。「+1」は Noto Sans CJK JP の Black で描いている -->

  <defs>
    <symbol id="ship" viewBox="0 0 512 512">
          <!-- マスト -->
          <rect x="150" y="118" width="9" height="182" />
          <rect x="352" y="136" width="9" height="164" />
          <!-- 帆桁（たたんだ帆） -->
          <rect x="118" y="150" width="74" height="10" rx="5" />
          <rect x="126" y="200" width="58" height="9" rx="4.5" />
          <rect x="322" y="166" width="70" height="10" rx="5" />
          <rect x="330" y="214" width="54" height="9" rx="4.5" />
          <!-- 船首の突き出し（バウスプリット） -->
          <path d="M418,288 L486,252 L490,259 L424,298 Z" />
          <!-- 煙突 -->
          <rect x="240" y="150" width="34" height="150" />
          <rect x="235" y="146" width="44" height="12" rx="3" />
          <!-- 外輪のおおい -->
          <path d="M200,302 A57,57 0 0 1 314,302 Z" />
          <!-- 船体 -->
          <path d="M86,292 L446,280 L420,344 Q410,360 386,362 L140,362 Q112,360 102,344 Z" />
        </symbol>
    <linearGradient id="skyC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a9df4"/><stop offset="0.62" stop-color="#9fdcff"/></linearGradient>
    <linearGradient id="seaC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1667c9"/><stop offset="1" stop-color="#0b3d86"/></linearGradient>
    <linearGradient id="goldC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff07a"/><stop offset="1" stop-color="#ffb21e"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#skyC)"/>
  <circle cx="404" cy="104" r="46" fill="#fff6c2" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.9"><circle cx="250" cy="126" r="22"/><circle cx="218" cy="104" r="27"/><circle cx="178" cy="88" r="31"/><circle cx="134" cy="80" r="28"/></g>
  <g transform="translate(-14 10)">
    <use href="#ship" fill="#1a1a1f"/>
    <path d="M220,302 A37,37 0 0 1 294,302" fill="none" stroke="#ffcf3a" stroke-width="6"/>
    <g stroke="#ffcf3a" stroke-width="5"><line x1="257" y1="302" x2="257" y2="268"/><line x1="257" y1="302" x2="232" y2="278"/><line x1="257" y1="302" x2="282" y2="278"/></g>
    <rect x="112" y="310" width="300" height="9" fill="#ffcf3a"/>
  </g>
  <path d="M0,360 Q32,344 64,358 T128,358 T192,358 T256,358 T320,358 T384,358 T448,358 T512,358 L512,512 L0,512 Z" fill="url(#seaC)"/>
  <path d="M0,360 Q32,344 64,358 T128,358 T192,358 T256,358 T320,358 T384,358 T448,358 T512,358" fill="none" stroke="#e6f6ff" stroke-width="7" stroke-linecap="round"/>
  <!-- 押す指（手のマーク）と、はじける線。指先が船の横腹をつつく -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round">
    <line x1="318" y1="352" x2="302" y2="334"/><line x1="350" y1="342" x2="352" y2="318"/><line x1="382" y1="352" x2="398" y2="336"/>
  </g>
  <g transform="translate(340 368) rotate(-16) scale(0.62)">
    <path d="M14,0 C24,0 30,7 30,16 L30,70 L36,64 C44,56 58,58 62,68 L62,72 L70,66 C78,60 92,64 94,76 L102,72 C112,68 124,74 124,88 L124,138 C124,170 104,192 74,192 L50,192 C30,192 18,182 8,166 L-30,104 C-36,94 -32,84 -22,80 C-14,77 -6,80 0,88 L0,16 C0,7 6,0 14,0 Z"
          fill="#ffffff" stroke="#1a1a1f" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <text x="64" y="468" font-family="Noto Sans CJK JP" font-weight="900" font-size="78" fill="url(#goldC)" stroke="#7a3b00" stroke-width="7" paint-order="stroke">+1</text>
</svg>
